version: '3.8'

services:
  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-building
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=mysql://smart_building:password123@db:3306/smart_building
      - NEXTAUTH_SECRET=sk-this-is-a-development-secret-min-32-chars-1234567890
      - NEXTAUTH_URL=http://192.168.1.73:3000
      - EMAIL_USER=stroedaniel@yahoo.com
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - SMTP_HOST=smtp.mail.yahoo.com
      - SMTP_PORT=465
      - NEXT_PUBLIC_SITE_URL=http://192.168.1.73:3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - ./public/images:/app/public/images
      - ./public/documents:/app/public/documents
    command: npm run dev
    networks:
      - smart-building-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: smart-building-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: smart_building
      MYSQL_USER: smart_building
      MYSQL_PASSWORD: password123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/02_schema.sql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    networks:
      - smart-building-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # phpMyAdmin for Database Management
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: smart-building-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: rootpassword123
      PMA_DEFAULT_SERVER: db
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - smart-building-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/index.php"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db_data:
    driver: local

networks:
  smart-building-network:
    driver: bridge
